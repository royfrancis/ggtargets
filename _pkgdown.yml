title: ggtargets
url: https://github.com/royfrancis/ggtargets

template:
  bootstrap: 5
  light-switch: true
  bslib:
    base_font: {google: "Quicksand"}
  opengraph:
    image:
      src: man/figures/seo.webp
      alt: "ggtargets card"

authors:
  Roy Francis:
    href: https://royfrancis.com

navbar:
  structure:
    left: [home, intro, articles, reference, news]
    right: [search, github, lightswitch]
  components:
    home:
      text: Home
      href: index.html
    reference:
      text: Reference
      href: reference/index.html
    news:
      text: Versions
      href: news/index.html
    github:
      icon: fa-github fa-lg fas
      href: https://github.com/royfrancis/ggtargets

home:
  title: "ggtargets: metro-style ggplot2 plots of targets pipelines"
  sidebar:
    # the hex sticker leads the sidebar (no script needed); the default sections follow.
    # pkgdown classes the wrapper div by the slug of the title ("Hex sticker" -> .hex-sticker),
    # which pkgdown/extra.css styles. Both logos are in the markup; extra.css shows the one
    # matching the light/dark switch.
    structure: [logo, links, license, citation, authors, dev]
    components:
      logo:
        title: Hex sticker
        text: '<img class="ggtargets-logo ggtargets-logo-light" src="reference/figures/logo-light.webp" alt="ggtargets logo" width="140" height="161"><img class="ggtargets-logo ggtargets-logo-dark" src="reference/figures/logo-dark.webp" alt="ggtargets logo" width="140" height="161">'

reference:

- title: Plot a targets pipeline
  contents:
   - tar_ggplot
   - tar_dag
   - targets_status_colors
   - targets_node_shapes

- title: Build plots from any DAG
  contents:
   - as_dag
   - dag_collapse
   - dag_layout
   - ggplot_dag
   - dag_size
   - ggsave_dag

- title: Style and layers
  contents:
   - style_metro
   - dag_layers
   - dag_theme

- title: Colors
  contents:
   - metro_palette

articles:

- title: Get started
  contents: [ggtargets]

- title: Using ggtargets
  navbar: Usage
  contents: [articles/colors, customizing, articles/collapsing, articles/ggplot2-integration, other-inputs]

- title: Examples
  navbar: Examples
  contents: [articles/gallery]

- title: Developers
  navbar: Developers
  contents: [how-it-works]
