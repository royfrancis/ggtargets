## GITHUB ACTION FOR R PACKAGE
## Build, check, test, code coverage on Linux
## Coverage runs on release R only; Windows R-CMD-check is in windows.yml
## Required secrets: CODECOV_TOKEN

name: linux
on:
  workflow_dispatch:
  push:
    tags:
      - v*
  pull_request:

permissions: read-all

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_KEEP_PKG_SOURCE: yes

jobs:
  linux:
    runs-on: ubuntu-latest
    name: ubuntu-latest (${{ matrix.r }})
    strategy:
      fail-fast: false
      matrix:
        r: ['release', 'oldrel-1', 'oldrel-2']

    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          extra-packages: |
            any::rcmdcheck
            any::pkgdepends
            any::covr
          needs: check

      - name: R CMD check
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          error-on: '"warning"'
          check-dir: '"check"'

      - name: Code coverage
        if: matrix.r == 'release'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: Rscript -e 'covr::codecov(quiet=FALSE)'
