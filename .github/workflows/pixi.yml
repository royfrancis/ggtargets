## GITHUB ACTION FOR R PACKAGE
## Build the conda package (noarch, pure R) with rattler-build and upload it to prefix.dev
## Recipe: conda.recipe/recipe.yaml; the version is read from DESCRIPTION
## Upload runs on v* tag pushes, or on a manual run with `upload` ticked. A manual run with
## `upload` unticked only builds. When the ref is a tag it must match the DESCRIPTION version;
## a manual run from a branch uploads whatever version DESCRIPTION has. prefix.dev won't
## overwrite a version, so bump DESCRIPTION before uploading again.
## Upload uses OIDC trusted publishing, so no secret is needed. One-time setup on prefix.dev:
## make sure the channel exists, then add this repo and workflow file (pixi.yml) under the
## channel's Repository Access. The channel is the namespace's primary channel, royfrancis
## (https://prefix.dev/royfrancis); a non-primary channel would be <namespace>/<channel>.
## Override it with the repo variable PREFIX_CHANNEL.

name: pixi
on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload the built package to prefix.dev
        type: boolean
        default: false
  push:
    tags:
      - v*

permissions:
  contents: read
  id-token: write

env:
  PREFIX_CHANNEL: ${{ vars.PREFIX_CHANNEL || 'royfrancis' }}

jobs:
  pixi-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Read package version
        run: |
          version=$(sed -n 's/^Version: *//p' DESCRIPTION)
          test -n "$version"
          echo "GGTARGETS_VERSION=$version" >> "$GITHUB_ENV"

      - name: Check tag matches package version
        if: github.ref_type == 'tag' && (github.event_name == 'push' || inputs.upload)
        run: |
          if [ "$GITHUB_REF_NAME" != "v$GGTARGETS_VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not 'v$GGTARGETS_VERSION' (the DESCRIPTION version); refusing to upload"
            exit 1
          fi

      - name: Build conda package
        uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          recipe-path: conda.recipe/recipe.yaml
          build-args: -c conda-forge

      - name: Upload to prefix.dev
        if: github.event_name == 'push' || inputs.upload
        run: rattler-build upload prefix --channel "$PREFIX_CHANNEL" output/noarch/*.conda
