## GITHUB ACTION FOR R PACKAGE
## Build, check, test on Windows
## Linux R-CMD-check and code coverage are in linux.yml

name: windows
on:
  workflow_dispatch:
  push:
    tags:
      - v*
  pull_request:

permissions: read-all

env:
  GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
  R_KEEP_PKG_SOURCE: yes

jobs:
  windows:
    runs-on: windows-latest
    name: windows-latest (${{ matrix.r }})
    strategy:
      fail-fast: false
      matrix:
        r: ['devel', 'release', 'oldrel-1']
        include:
          - r: 'devel'
            http-user-agent: 'release'

    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          http-user-agent: ${{ matrix.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 2
          extra-packages: |
            any::rcmdcheck
            any::pkgdepends
          needs: check

      # Workaround for https://github.com/r-lib/rcmdcheck/issues/236: on Windows the
      # Quarto vignette engine can't see the temporary library that R CMD build
      # installs the package into, so library(ggtargets) fails. Installing into the
      # regular library first makes it visible. R.exe, since `R` is a PowerShell alias.
      # Remove once rcmdcheck/pkgbuild fix the library path.
      - name: Install package for vignettes
        run: R.exe CMD INSTALL .

      - name: R CMD check
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
          error-on: '"warning"'
          check-dir: '"check"'
